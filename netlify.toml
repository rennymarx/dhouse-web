# Netlify konfigurace - dhouse.cz
# JEDEN web (papaya-genie-f481ff) slouzi jako staging i produkce (rozhodnuti 2026-07-05).
#
# STAGING (nyni): publikuje _deploy/site = v2 s meta noindex (staging neni verejny pro Google).
#   Hezke URL (/galerie -> /galerie.html) resi Netlify automaticky.
#   Bezpecnostni hlavicky + CSP a presmerovani si nese sama publish slozka:
#   _deploy/site/netlify.toml  a  _deploy/site/_redirects.
#
# OSTRE SPUSTENI na dhouse.cz:
#   1) zmen nize  publish = "_deploy/prod"
#      (prod build je BEZ noindex; hlavicky/CSP nese _deploy/prod/_headers,
#       presmerovani _deploy/prod/_redirects)
#   2) commit + push  ->  Netlify nasadi prod build na tuto site
#   Pozn.: netlify.toml ma prednost pred nastavenim v Netlify UI, proto se publish prepina ZDE.
#
# (Drive zde byl X-Robots-Tag=noindex a verzovane /:v/ redirecty - odstraneno 2026-07-05:
#  noindex resi meta tag na strankach a hlavickovy noindex byl mina do launche;
#  verzovani /1 /2 uz neexistuje.)

[build]
  publish = "_deploy/site"
  command = ""
