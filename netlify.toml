# Netlify konfigurace — statický web, žádný build.
# Publikuje se verzovaná struktura z _deploy/site (rozcestník + /1/, /2/, ...).
# Novou verzi vygeneruje: powershell -File _deploy.ps1 -Version <N>  → commit → push.
[build]
  publish = "_deploy/site"
  command = ""

# Hezké URL bez .html uvnitř verzovaných složek (/1/galerie → /1/galerie.html)
[[redirects]]
  from = "/:v/galerie"
  to = "/:v/galerie.html"
  status = 200
[[redirects]]
  from = "/:v/kvalita"
  to = "/:v/kvalita.html"
  status = 200
[[redirects]]
  from = "/:v/atelier"
  to = "/:v/atelier.html"
  status = 200
[[redirects]]
  from = "/:v/kontakt"
  to = "/:v/kontakt.html"
  status = 200
[[redirects]]
  from = "/:v/dekujeme"
  to = "/:v/dekujeme.html"
  status = 200
[[redirects]]
  from = "/:v/impressum"
  to = "/:v/impressum.html"
  status = 200
[[redirects]]
  from = "/:v/obchodni-podminky"
  to = "/:v/obchodni-podminky.html"
  status = 200
[[redirects]]
  from = "/:v/ochrana-osobnich-udaju"
  to = "/:v/ochrana-osobnich-udaju.html"
  status = 200
[[redirects]]
  from = "/:v/blog/:slug"
  to = "/:v/blog/:slug.html"
  status = 200

# Bezpečnostní hlavičky + noindex (staging — před ostrým spuštěním odstranit X-Robots-Tag)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    X-Robots-Tag = "noindex, nofollow"
