<head>

<title>Blog validátor — dhouse</title>
<style>
  body { font: 14px/1.5 ui-monospace, "JetBrains Mono", Consolas, monospace; padding: 32px; background: #f5f3ee; color: #161512; max-width: 900px; margin: 0 auto; }
  h1 { font: 600 28px/1 ui-sans-serif, system-ui, sans-serif; margin: 0 0 12px; }
  .sub { color: #777; margin: 0 0 32px; }
  .post { background: #fff; border: 1px solid rgba(22,21,18,0.1); padding: 20px; margin-bottom: 16px; }
  .post h2 { font: 600 16px/1.3 ui-sans-serif, system-ui, sans-serif; margin: 0 0 8px; }
  .slug { color: #8a6a3b; font-size: 12px; margin-bottom: 12px; }
  .check { display: flex; gap: 12px; padding: 6px 0; align-items: baseline; }
  .ok { color: #2d6a32; }
  .err { color: #b3261e; font-weight: 600; }
  .pending { color: #999; }
  .label { min-width: 180px; }
  .value { color: #555; word-break: break-all; }
  .summary { background: #161512; color: #f5f3ee; padding: 20px; margin-top: 32px; font-size: 16px; }
  .summary.all-ok { background: #2d6a32; }
  .summary.has-err { background: #b3261e; }
  code { background: #ebe7df; padding: 2px 6px; border-radius: 3px; }
</style>

<body>

<h1>Blog validátor</h1>
<p class="sub">Otevři tuto stránku po každé úpravě posts.js. Pro každý článek musí být všechny ✅. Pokud něco není zelené, oprav to a obnov stránku.</p>

<div id="checks"></div>
<div id="summary" class="summary pending">⏳ Načítám…</div>

<script src="/blog/posts.js"></script>
<script>
(function () {
  var holder = document.getElementById('checks');
  var summary = document.getElementById('summary');
  var totalErr = 0;
  var totalOk = 0;

  function row(label, ok, value, hint) {
    var cls = ok === true ? 'ok' : (ok === false ? 'err' : 'pending');
    var ico = ok === true ? '✅' : (ok === false ? '❌' : '⏳');
    var html = '<div class="check"><span class="' + cls + '">' + ico + '</span>' +
      '<span class="label">' + label + '</span>' +
      '<span class="value">' + (value || '') + (hint ? ' <em>(' + hint + ')</em>' : '') + '</span></div>';
    if (ok === false) totalErr++;
    else if (ok === true) totalOk++;
    return html;
  }

  function head(url) {
    return fetch(url, { method: 'HEAD' }).then(function (r) { return r.ok; }).catch(function () { return false; });
  }

  if (typeof window.BLOG_POSTS === 'undefined' || !Array.isArray(window.BLOG_POSTS)) {
    holder.innerHTML = '<div class="post"><h2 class="err">❌ window.BLOG_POSTS chybí nebo není pole. Zkontroluj posts.js syntax v konzoli.</h2></div>';
    summary.className = 'summary has-err';
    summary.textContent = '❌ posts.js je rozbitý — viz konzole (F12).';
    return;
  }

  if (window.BLOG_POSTS.length === 0) {
    holder.innerHTML = '<div class="post"><h2>⚠️ Pole BLOG_POSTS je prázdné. Žádné články k validaci.</h2></div>';
    summary.className = 'summary';
    summary.textContent = '⚠️ Zatím žádné články.';
    return;
  }

  var posts = window.BLOG_POSTS;
  var promises = [];

  posts.forEach(function (p, i) {
    var divId = 'p' + i;
    var html = '<div class="post" id="' + divId + '"><h2>' + (p.title || '<em>chybí title</em>') + '</h2>' +
      '<div class="slug">slug: ' + (p.slug || '<em>chybí</em>') + '</div>';

    // Synchronní kontroly schématu
    html += row('slug',         !!(p.slug && /^[a-z0-9-]+$/.test(p.slug)), p.slug, !p.slug ? 'chybí' : (/^[a-z0-9-]+$/.test(p.slug) ? '' : 'jen lowercase/čísla/pomlčky, bez diakritiky'));
    html += row('title',        !!(p.title && p.title.length >= 10), p.title, p.title && p.title.length < 10 ? 'krátký' : (!p.title ? 'chybí' : ''));
    html += row('date (ISO)',   !!(p.date && /^\d{4}-\d{2}-\d{2}$/.test(p.date)), p.date, !p.date ? 'chybí' : (/^\d{4}-\d{2}-\d{2}$/.test(p.date) ? '' : 'musí být YYYY-MM-DD'));
    html += row('excerpt',      !!(p.excerpt && p.excerpt.length >= 60 && p.excerpt.length <= 220), p.excerpt, !p.excerpt ? 'chybí' : (p.excerpt.length < 60 ? 'krátký (' + p.excerpt.length + ')' : (p.excerpt.length > 220 ? 'dlouhý (' + p.excerpt.length + ')' : '')));
    html += row('image (cesta)', !!(p.image && p.image.indexOf('/blog/img/') === 0), p.image, !p.image ? 'chybí' : '');
    html += row('tags',         !!(Array.isArray(p.tags) && p.tags.length >= 1), p.tags && p.tags.join(', '), !p.tags || p.tags.length === 0 ? 'doporučen aspoň 1 tag' : '');
    html += row('author',       !!p.author, p.author, !p.author ? 'chybí' : '');

    // Asynchronní HEAD kontroly
    html += '<div class="check" data-check="html-' + i + '"><span class="pending">⏳</span><span class="label">HTML soubor existuje</span><span class="value">/blog/' + p.slug + '.html</span></div>';
    html += '<div class="check" data-check="img-' + i + '"><span class="pending">⏳</span><span class="label">hero obrázek existuje</span><span class="value">' + (p.image || '') + '</span></div>';
    html += '</div>';

    holder.innerHTML += html;

    if (p.slug) {
      promises.push(head('/blog/' + p.slug + '.html').then(function (ok) {
        var el = document.querySelector('[data-check="html-' + i + '"]');
        if (!el) return;
        el.innerHTML = '<span class="' + (ok ? 'ok' : 'err') + '">' + (ok ? '✅' : '❌') + '</span>' +
          '<span class="label">HTML soubor existuje</span>' +
          '<span class="value">/blog/' + p.slug + '.html' + (ok ? '' : ' — <em>NENALEZEN. Vytvoř kopií _template.html.</em>') + '</span>';
        if (ok) totalOk++; else totalErr++;
      }));
    }
    if (p.image) {
      promises.push(head(p.image).then(function (ok) {
        var el = document.querySelector('[data-check="img-' + i + '"]');
        if (!el) return;
        el.innerHTML = '<span class="' + (ok ? 'ok' : 'err') + '">' + (ok ? '✅' : '❌') + '</span>' +
          '<span class="label">hero obrázek existuje</span>' +
          '<span class="value">' + p.image + (ok ? '' : ' — <em>NENALEZEN. Vlož soubor.</em>') + '</span>';
        if (ok) totalOk++; else totalErr++;
      }));
    }
  });

  Promise.all(promises).then(function () {
    if (totalErr === 0) {
      summary.className = 'summary all-ok';
      summary.textContent = '✅ Vše OK — ' + totalOk + ' kontrol prošlo, žádné chyby. Můžeš commit + push.';
    } else {
      summary.className = 'summary has-err';
      summary.textContent = '❌ ' + totalErr + ' chyb / ' + totalOk + ' OK. Oprav výše uvedené před commitem.';
    }
  });
})();
</script>
</body>
</html>
