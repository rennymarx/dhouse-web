<style>
/* Layout: one-column stepper (max 640px) on a warm dark ground; image-led question cards, option rows as tall tappable buttons, sticky bottom action bar. Single committed dark look (brand LP is dark). */
:root {
  color-scheme: dark;
  --bg: #15130f;
  --surface: #1e1b16;
  --surface-2: #28241d;
  --line: #3b352c;
  --fg: #f3ede4;
  --muted: #a99f91;
  --accent: #e8893a;
  --accent-ink: #1a120a;
  --font-display: "Fraunces", "Georgia", "Times New Roman", serif;
  --font-body: "Figtree", "Helvetica Neue", Arial, sans-serif;
  --radius: 14px;
  --col: 640px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
#app { min-height: 100%; display: flex; flex-direction: column; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top-inner {
  max-width: var(--col); margin: 0 auto; padding: 12px 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand { font-weight: 700; letter-spacing: 0.02em; font-size: 15px; }
.brand span { color: var(--accent); }
.step { font-size: 13px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.progress { height: 3px; background: var(--line); }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }
main { flex: 1; width: 100%; max-width: var(--col); margin: 0 auto; padding-block: 24px 120px; padding-inline: 16px; }
.eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0 0 10px; }
h1, h2, .q { font-family: var(--font-display); font-weight: 500; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(34px, 7vw, 46px); line-height: 1.08; letter-spacing: -0.01em; }
h2 { font-size: clamp(26px, 5.4vw, 34px); line-height: 1.15; }
.q { font-size: clamp(22px, 4.8vw, 28px); line-height: 1.22; margin-top: 14px; }
p { margin: 0; }
.lead { color: var(--fg); max-width: 60ch; }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-lg { display: flex; flex-direction: column; gap: 22px; }
.hint { font-size: 14px; color: var(--muted); letter-spacing: 0.04em; }
figure { margin: 0; }
.photo { width: 100%; max-width: 100%; border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.photo img { display: block; width: 100%; height: auto; }
.photo.wide { aspect-ratio: 6 / 5; }
.photo.tall { aspect-ratio: 4 / 5; max-height: 62vh; }
.photo.tall img, .photo.wide img { width: 100%; height: 100%; object-fit: cover; }
.options { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.opt {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 15px 16px; font: inherit; line-height: 1.35; cursor: pointer;
  transition: border-color .15s, background .15s, transform .08s;
}
.opt:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.opt:active { transform: scale(.995); }
.opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt .box { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; }
.opt.multi .box { border-radius: 6px; }
.opt .box i { width: 10px; height: 10px; border-radius: 50%; background: transparent; }
.opt.multi .box i { border-radius: 2px; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.opt[aria-pressed="true"] .box { border-color: var(--accent); }
.opt[aria-pressed="true"] .box i { background: var(--accent); }
.opt[disabled] { opacity: .45; cursor: not-allowed; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick { position: relative; border: 2px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); padding: 0; cursor: pointer; font: inherit; color: var(--fg); text-align: left; }
.pick img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }
.pick .cap { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; font-size: 14px; font-weight: 600; }
.pick .cap b { color: var(--accent); font-weight: 700; }
.pick .cap .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--muted); display: grid; place-items: center; }
.pick .cap .box i { width: 10px; height: 10px; border-radius: 2px; }
.pick[aria-pressed="true"] { border-color: var(--accent); }
.pick[aria-pressed="true"] .cap .box { border-color: var(--accent); }
.pick[aria-pressed="true"] .cap .box i { background: var(--accent); }
.pick[disabled] { opacity: .45; cursor: not-allowed; }
.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.thumbs { display: flex; gap: 10px; }
.thumbs img { width: 92px; height: 92px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
.strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.strip img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 8px; display: block; }
textarea {
  width: 100%; min-height: 128px; resize: vertical; font: inherit; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
}
input[type="email"] {
  width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px;
}
textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.examples { font-size: 14px; color: var(--muted); font-style: italic; border-left: 2px solid var(--line); padding-left: 12px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px;
  padding: 15px 26px; font: inherit; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-size: 14px;
  cursor: pointer; transition: filter .15s, transform .08s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(.98); }
.btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn.block { width: 100%; }
.link { background: none; border: 0; color: var(--muted); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px 0; }
.link:hover { color: var(--fg); }
.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
}
.bar-inner { max-width: var(--col); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--muted); }
.meta span::before { content: "·"; margin-right: 10px; color: var(--line); }
.meta span:first-child::before { content: none; margin: 0; }
.note { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; }
.note b { color: var(--accent); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }
blockquote { margin: 0; padding: 18px 20px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 var(--radius) var(--radius) 0; }
blockquote .small { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
blockquote .quote { font-family: var(--font-display); font-size: clamp(20px, 4.4vw, 26px); line-height: 1.3; }
.module { padding: 22px 0 26px; border-top: 1px solid var(--line); }
.module .axis { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.module .axis b { color: var(--accent); font-weight: 600; }
.module h2 { margin-bottom: 12px; }
.module p + p { margin-top: 10px; }
.module .body { max-width: 62ch; }
.cta { margin-top: 10px; padding: 26px 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; gap: 14px; }
.panel { border: 1px solid var(--accent); border-radius: var(--radius); padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
.panel h3 { margin: 0; font-family: var(--font-body); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; background: var(--surface-2); padding: 2px 6px; border-radius: 6px; overflow-wrap: anywhere; }
details { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
summary { cursor: pointer; font-weight: 600; color: var(--muted); }
details[open] summary { margin-bottom: 10px; color: var(--fg); }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.tag { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; margin: 2px 4px 2px 0; }
.fade { animation: fade .28s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } .progress i { transition: none; } }
@media (max-width: 420px) { .thumbs img { width: 76px; height: 76px; } .opt { padding: 13px 14px; font-size: 16px; } }
</style>

];

function scoreAnswers(answers) {
  const scores = { 1: 0, 2: 0, 3: 0, 4: 0 };
  const signals = [];
  for (const q of QUESTIONS) {
    if (!q.options) continue;
    const picked = [].concat(answers[q.id] || []);
    for (const k of picked) {
      const opt = q.options.find(o => o.k === k);
      if (!opt) continue;
      for (const ax in opt.s) scores[ax] += opt.s[ax];
      if (opt.signal) signals.push(opt.signal);
    }
  }
  const result = {};
  for (const ax of [1, 2, 3, 4]) {
    const t = AXES[ax];
    result[ax] = scores[ax] <= t.A ? 'A' : (scores[ax] >= t.C ? 'C' : 'B');
  }
  return { scores, result, signals, code: [1, 2, 3, 4].map(ax => ax + result[ax]).join('') };
}

// Pozor: doména webhooku musí být povolená v CSP connect-src (_deploy/prod/_headers) – hook.eu1.make.com už je.
const KLARA_WEBHOOK_URL = 'https://hook.eu1.make.com/pqr3zr4rh610pmrnjiekytszitqd1kg5';
const HANDOFF_BASE = 'https://online.dhouse.cz/klara/dotaznik';
const PAGE_PARAMS = new URLSearchParams(location.search);

// UTM z reklamy jdou do dotazníku beze změny; utm_term nese ID + kód výsledku.
function handoffUrl(id, code) {
  const p = new URLSearchParams();
  const defaults = { utm_source: 'facebook', utm_medium: 'paid', utm_campaign: 'klara', utm_content: '' };
  for (const key in defaults) {
    const v = PAGE_PARAMS.get(key) || defaults[key];
    if (v) p.set(key, v);
  }
  p.set('utm_term', `${id}-${code}`);
  return `${HANDOFF_BASE}?${p.toString()}`;
}

// Odeslání výsledku na Make: keepalive, max 1,5 s čekání, chyba nikdy nezastaví přesměrování.
function sendResult(payload) {
  if (!KLARA_WEBHOOK_URL) return Promise.resolve();
  const req = fetch(KLARA_WEBHOOK_URL, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload), keepalive: true
  }).catch(() => {});
  return Promise.race([req, new Promise(res => setTimeout(res, 1500))]);
}

const SCREENS = ['intro', ...QUESTIONS.map(q => q.id), 'email', 'result'];

const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function makeId() { return Math.random().toString(36).slice(2, 10); }
function current() { return SCREENS[state.step]; }
function go(step) { state.step = Math.max(0, Math.min(SCREENS.length - 1, step)); render(); window.scrollTo(0, 0); }

function render() {
  const id = current();
  const main = $('#screen');
  const bar = $('#bar');
  const qIndex = QUESTIONS.findIndex(q => q.id === id);
  const label = $('#stepLabel');
  const prog = $('#progressBar');
  if (qIndex >= 0) { label.textContent = `Otázka ${qIndex + 1} / ${QUESTIONS.length}`; prog.style.width = `${((qIndex + 1) / QUESTIONS.length) * 100}%`; }
  else if (id === 'intro') { label.textContent = 'Vizuální test'; prog.style.width = '0%'; }
  else { label.textContent = id === 'email' ? 'Hotovo' : 'Vaše mapa'; prog.style.width = '100%'; }

  let html = '';
  if (id === 'intro') html = renderIntro();
  else if (id === 'email') html = renderEmail();
  else if (id === 'result') html = renderResult();
  else html = renderQuestion(QUESTIONS[qIndex]);
  main.innerHTML = `<div class="fade">${html}</div>`;

  // spodní lišta
  const q = qIndex >= 0 ? QUESTIONS[qIndex] : null;
  const showBar = !!q;
  bar.hidden = !showBar;
  if (showBar) {
    const next = $('#nextBtn');
    const needsNext = q.type !== 'single';
    next.hidden = !needsNext;
    next.textContent = q.id === 'q10' ? 'Ukázat moji mapu' : 'Pokračovat';
    next.disabled = !isComplete(q);
  }
  bindScreen(q);
}

function isComplete(q) {
  const a = state.answers[q.id];
  if (q.type === 'single') return !!a;
  if (q.type === 'multi') return Array.isArray(a) && a.length >= 1;
  if (q.type === 'pick2') return Array.isArray(a) && a.length === 2;
  if (q.type === 'text') return true;
  return false;
}

    const key = ax + r.result[ax]; const m = MODULES[key];
    return `<section class="module"><div class="axis">Osa ${ax} · ${esc(AXES[ax].name)} · <b>${key}</b></div><h2>${esc(m.title)}</h2><div class="body">${m.paras.map(p => `<p>${esc(p)}</p>`).join('')}</div></section>`;
  }).join('');

  const qa = [1, 2, 3, 4].map(ax => `<tr><td>Osa ${ax}</td><td>${esc(AXES[ax].name)}</td><td>${r.scores[ax] > 0 ? '+' : ''}${r.scores[ax]}</td><td>A ≤ ${AXES[ax].A} · C ≥ +${AXES[ax].C}</td><td><b>${r.result[ax]}</b></td></tr>`).join('');
  const picked = QUESTIONS.filter(q => q.options).map(q => `<tr><td>${q.id}</td><td>${[].concat(state.answers[q.id] || []).map(k => `<span class="tag">${esc(k)}</span>`).join('') || '<span class="muted">—</span>'}</td></tr>`).join('');

  return `
    <div class="stack-lg">
      <div><p class="eyebrow">Vaše mapa</p>
        ${sentence ? `<blockquote><div class="small">Vaše kuchyň by měla začít tady</div><div class="quote">„${esc(sentence)}“</div></blockquote>` : ''}
      </div>
      <p class="lead">Vaše kuchyň nemusí mít jeden styl. Potřebuje ale čtyři věci, které se ve vašich odpovědích opakovaly.</p>
      <div>${mods}</div>
      <div class="cta">
        <h2>Teď už víte, co ve své kuchyni hledáte.</h2>
        <p class="lead">Pokud chcete, můžeme z téhle mapy vyjít při skutečném návrhu vaší kuchyně.</p>
        <p class="lead">Nemusíte mít vybraná dvířka, spotřebiče ani přesný styl. Právě od toho je další krok.</p>
        <div><button class="btn" id="handoffBtn" type="button" data-href="${esc(handoff)}">Chci jít o krok dál</button></div>
      </div>
      ${DEBUG ? `<div class="panel" id="handoffPanel">
        <h3>Prototyp · předání do praktického dotazníku</h3>
        <p class="muted" style="font-size:14px">V ostré verzi tlačítko otevře praktický dotazník v Konverzkách s touto adresou. UTM z reklamy jdou dál beze změny, kód výsledku jede v utm_term:</p>
        <code>${esc(handoff)}</code>
        <dl class="kv">
          <dt>klara_kod</dt><dd>${codePretty}</dd>
          <dt>klara_osa1–4</dt><dd>${[1, 2, 3, 4].map(ax => r.result[ax]).join(', ')}</dd>
          <dt>klara_veta</dt><dd>${sentence ? esc(sentence) : '<span class="muted">(nevyplněno)</span>'}</dd>
          <dt>klara_bolest</dt><dd>${pain ? esc(pain.t) : '<span class="muted">(nevyplněno)</span>'}</dd>
          <dt>klara_signaly</dt><dd>${r.signals.length ? r.signals.map(s => `<span class="tag">${esc(s)}</span>`).join('') : '<span class="muted">žádné</span>'}</dd>
          <dt>e-mail</dt><dd>${state.email ? esc(state.email) : '<span class="muted">nezadán</span>'}</dd>
        </dl>
      </div>
      <details>
        <summary>Kontrola bodování (jen pro prototyp)</summary>
        <div style="overflow-x:auto"><table><thead><tr><th>Osa</th><th>Název</th><th>Skóre</th><th>Prahy</th><th>Výsledek</th></tr></thead><tbody>${qa}</tbody></table></div>
        <div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>Otázka</th><th>Zvolené odpovědi (klíče z matice)</th></tr></thead><tbody>${picked}</tbody></table></div>
      </details>` : ''}
      <div style="display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap">
        <span class="muted" style="font-size:13px">Kód: ${codePretty}</span>
      </div>
    </div>`;
}

function bindScreen(q) {
  const start = $('#startBtn'); if (start) start.addEventListener('click', () => go(1));
  $('#backBtn').onclick = () => go(state.step - 1);
  $('#nextBtn').onclick = () => { if (q && q.type === 'text') state.answers.q10 = ($('#q10text')?.value || '').trim(); go(state.step + 1); };

  if (q && q.type === 'single') {
    document.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      state.answers[q.id] = b.dataset.k;
      document.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', x === b));
      setTimeout(() => go(state.step + 1), 320);
    }));
  }
  if (q && (q.type === 'multi' || q.type === 'pick2')) {
    const max = q.type === 'pick2' ? 2 : q.max;
    document.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
      const sel = [].concat(state.answers[q.id] || []);
      const k = b.dataset.k; const i = sel.indexOf(k);
      if (i >= 0) sel.splice(i, 1); else if (sel.length < max) sel.push(k);
      state.answers[q.id] = sel;
      if (q.type === 'pick2') state.answers.q6b = undefined; // nové obrázky = nová otázka 6b
      render();
      if (q.type === 'pick2' && sel.length === 2) setTimeout(() => go(state.step + 1), 380);
    }));
  }
  if (q && q.type === 'text') {
    const ta = $('#q10text'); ta.addEventListener('input', () => { state.answers.q10 = ta.value; });
    setTimeout(() => ta.focus({ preventScroll: true }), 50);
  }
  const form = $('#emailForm');
  if (form) {
    form.addEventListener('submit', e => {
      e.preventDefault();
      state.email = $('#emailInput').value.trim();
      // Mapa e-mailem: Make ji pošle přes Ecomail (z radek@dhouse.cz). Nečeká se, výsledek se ukáže hned.
      if (state.email) { if (!state.id) state.id = makeId(); sendResult(Object.assign(resultPayload(), { mapa: 'poslat' })); }
      go(state.step + 1);
    });
    $('#skipEmail').addEventListener('click', () => { state.email = ''; go(state.step + 1); });
  }
  const hb = $('#handoffBtn');
  if (hb) hb.addEventListener('click', () => {
    if (hb.disabled) return;
    hb.disabled = true;
    sendResult(resultPayload()).then(() => { location.href = hb.dataset.href; });
  });
}

// Návrat z dotazníku tlačítkem Zpět (bfcache) – tlačítko znovu povolit.
window.addEventListener('pageshow', e => { const b = $('#handoffBtn'); if (e.persisted && b) b.disabled = false; });

function startApp(saved) {
  if (saved && typeof saved === 'object' && saved.answers) state = Object.assign({ step: 0, answers: {}, email: '', id: '' }, saved);
  render();
}
try { if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') window.claude.hot.snapshot(() => state); } catch (e) {}
if (window.claude && window.claude.hot && typeof window.claude.hot.ready === 'function') window.claude.hot.ready(startApp);
else startApp((window.claude && window.claude.hot && window.claude.hot.data) || null);
</script>
</body>
</html>
