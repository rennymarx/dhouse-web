[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://js.hs-scripts.com https://js.hs-analytics.net https://js.hs-banner.com https://js.hsadspixel.net https://js.hscollectedforms.net https://js.usemessages.com https://js.hsforms.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.hsforms.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://www.facebook.com https://track.hubspot.com https://forms.hubspot.com https://forms.hscollectedforms.net https://*.hsforms.com https://*.hubspot.com; connect-src 'self' https://www.facebook.com https://connect.facebook.net https://track.hubspot.com https://forms.hscollectedforms.net https://forms.hubspot.com https://api.hubspot.com https://api.hubapi.com https://*.hsforms.com https://api.hsforms.com; frame-src https://mapy.com https://*.mapy.com https://*.hsforms.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://*.hsforms.com https://forms.hubspot.com; object-src 'none'"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"